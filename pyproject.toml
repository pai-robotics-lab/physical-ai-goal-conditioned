[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-goal-conditioned"
version = "0.1.0"
description = "Goal-conditioned vision and manipulation system using Genesis and Franka Panda"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
  "genesis-world==1.2.1",
  "torch==2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]
final = [
  "reportlab==4.4.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv-sim", ".venv-train", ".cache", "outputs"]

